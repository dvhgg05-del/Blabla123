name: Build plugins

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.dist/**'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout custom repository
        uses: actions/checkout@v4

      - name: Checkout LNReader plugin build environment
        uses: actions/checkout@v4
        with:
          repository: LNReader/lnreader-plugins
          ref: master
          path: base

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: base/package-lock.json

      - name: Install LNReader plugin dependencies
        run: npm ci
        working-directory: base

      - name: Inject plugin sources
        run: |
          mkdir -p base/plugins/english base/public/static/src/en
          cp plugins/english/*.ts base/plugins/english/
          cp -r public/static/src/en/. base/public/static/src/en/

      - name: Build plugin bundle and manifest
        run: |
          npm run build:compile
          npm run build:manifest
        working-directory: base

      - name: Publish only this repository's plugins
        env:
          BASE_MANIFEST: ${{ github.workspace }}/base/.dist/plugins.json
          BASE_DIST: ${{ github.workspace }}/base/.dist
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLISH_REF: main
        run: node scripts/rewrite-manifest.mjs

      - name: Smoke-test the compiled bundle
        env:
          BASE_DIR: ${{ github.workspace }}/base
        run: node scripts/smoke-test.mjs

      - name: Commit generated .dist files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .dist
          git diff --cached --quiet || git commit -m 'build: plugins'
          git push
