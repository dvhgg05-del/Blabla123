name: Build Novelpia plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "plugins/english/novelpiaglobal.ts"
      - "public/static/src/en/novelpiaglobal/**"
      - "scripts/rewrite-manifest.mjs"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: novelpia-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout custom repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout LNReader build repository
        uses: actions/checkout@v4
        with:
          repository: LNReader/lnreader-plugins
          ref: master
          path: base
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: base/package-lock.json

      - name: Install dependencies
        working-directory: base
        run: npm ci

      - name: Inject Novelpia plugin
        run: |
          mkdir -p base/plugins/english
          mkdir -p base/public/static/src/en/novelpiaglobal

          cp plugins/english/novelpiaglobal.ts \
            base/plugins/english/novelpiaglobal.ts

          cp public/static/src/en/novelpiaglobal/icon.png \
            base/public/static/src/en/novelpiaglobal/icon.png

      - name: Compile plugin
        working-directory: base
        run: |
          npm run build:compile

      - name: Build manifest
        working-directory: base
        run: |
          npm run build:manifest

      - name: Verify Novelpia
        run: |
          set -e

          test -s base/.js/plugins/english/novelpiaglobal.js
          test -f base/.dist/plugins.json

          node - <<'NODE'
          const fs = require('fs');

          const manifest = JSON.parse(
            fs.readFileSync('base/.dist/plugins.json', 'utf8')
          );

          const plugin = manifest.find(
            p => p.id === 'novelpiaglobal'
          );

          if (!plugin) {
            throw new Error(
              'Novelpia Global was not found in the generated manifest.'
            );
          }

          console.log('Novelpia plugin:');
          console.log(JSON.stringify(plugin, null, 2));

          if (!plugin.version) {
            throw new Error(
              'Novelpia plugin has no version.'
            );
          }

          if (!plugin.url) {
            throw new Error(
              'Novelpia plugin has no download URL.'
            );
          }

          console.log(
            `Verified Novelpia version ${plugin.version}`
          );
          NODE

      - name: Publish Novelpia manifest and bundle
        env:
          BASE_MANIFEST: ${{ github.workspace }}/base/.dist/plugins.json
          BASE_DIST: ${{ github.workspace }}/base/.dist
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/rewrite-manifest.mjs

      - name: Verify final distribution
        run: |
          set -e

          test -f .dist/plugins.json
          test -f .dist/plugins.min.json

          node - <<'NODE'
          const fs = require('fs');

          const manifest = JSON.parse(
            fs.readFileSync('.dist/plugins.json', 'utf8')
          );

          if (
            !Array.isArray(manifest) ||
            manifest.length !== 1 ||
            manifest[0].id !== 'novelpiaglobal'
          ) {
            throw new Error(
              'Final manifest does not contain exactly Novelpia Global.'
            );
          }

          console.log(
            'Final manifest:'
          );

          console.log(
            JSON.stringify(manifest[0], null, 2)
          );
          NODE

      - name: Commit generated files
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f .dist

          if git diff --cached --quiet; then
            echo "No generated files changed."
            exit 0
          fi

          git commit -m "build: Novelpia Global plugin"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main

      - name: Show extension URL
        run: |
          echo ""
          echo "=============================================="
          echo "BUILD SUCCESSFUL"
          echo ""
          echo "Extension manifest:"
          echo ""
          echo "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/.dist/plugins.min.json"
          echo ""
          echo "=============================================="
