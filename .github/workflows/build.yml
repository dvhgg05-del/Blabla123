name: Build Novelpia plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "plugins/english/novelpiaglobal.ts"
      - "public/static/src/en/novelpiaglobal/**"
      - "scripts/rewrite-manifest.mjs"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: novelpia-build
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # 1. Checkout YOUR repository
      # ----------------------------------------------------------
      - name: Checkout custom repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # 2. Checkout the real LNReader plugin build environment
      # ----------------------------------------------------------
      - name: Checkout LNReader plugin build environment
        uses: actions/checkout@v4
        with:
          repository: LNReader/lnreader-plugins
          ref: master
          path: base
          fetch-depth: 1

      # ----------------------------------------------------------
      # 3. Set up Node using LNReader's lockfile
      # ----------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: base/package-lock.json

      # ----------------------------------------------------------
      # 4. Install LNReader dependencies
      # ----------------------------------------------------------
      - name: Install LNReader plugin dependencies
        working-directory: base
        run: npm ci

      # ----------------------------------------------------------
      # 5. Copy your Novelpia source into the LNReader environment
      # ----------------------------------------------------------
      - name: Inject Novelpia source
        run: |
          mkdir -p base/plugins/english
          mkdir -p base/public/static/src/en/novelpiaglobal

          cp plugins/english/novelpiaglobal.ts \
            base/plugins/english/novelpiaglobal.ts

          cp public/static/src/en/novelpiaglobal/icon.png \
            base/public/static/src/en/novelpiaglobal/icon.png

      # ----------------------------------------------------------
      # 6. Compile the plugin and create LNReader manifest
      #
      # LNReader's own package.json defines:
      #   build:compile
      #   build:manifest
      # ----------------------------------------------------------
      - name: Build plugin bundle and manifest
        working-directory: base
        run: |
          npm run build:compile
          npm run build:manifest

      # ----------------------------------------------------------
      # 7. Verify Novelpia was actually compiled
      # ----------------------------------------------------------
      - name: Verify Novelpia output
        run: |
          set -e

          test -f base/.js/plugins/english/novelpiaglobal.js
          test -f base/.dist/plugins.json
          test -f base/.dist/plugins.min.json
          test -f base/public/static/src/en/novelpiaglobal/icon.png

          echo "Novelpia compiled successfully."

          node - <<'NODE'
          const fs = require('fs');

          const manifest = JSON.parse(
            fs.readFileSync('base/.dist/plugins.json', 'utf8')
          );

          const plugin = manifest.find(
            p => p.id === 'novelpiaglobal'
          );

          if (!plugin) {
            console.error(
              'ERROR: novelpiaglobal was not found in the LNReader manifest.'
            );
            process.exit(1);
          }

          console.log('Novelpia manifest entry:');
          console.log(JSON.stringify(plugin, null, 2));
          NODE

      # ----------------------------------------------------------
      # 8. Generate ONLY Novelpia artifacts for your repository
      # ----------------------------------------------------------
      - name: Publish only Novelpia artifacts into this repository
        env:
          BASE_MANIFEST: ${{ github.workspace }}/base/.dist/plugins.json
          BASE_DIST: ${{ github.workspace }}/base/.dist
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLISH_REF: main
        run: |
          node scripts/rewrite-manifest.mjs

      # ----------------------------------------------------------
      # 9. Commit generated .dist files
      # ----------------------------------------------------------
      - name: Commit generated .dist files
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .dist

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "build: Novelpia Global plugin"

          # Make sure we are based on the newest main branch.
          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main

      # ----------------------------------------------------------
      # 10. Print the URL to use in Tsundoku
      # ----------------------------------------------------------
      - name: Show source URL
        run: |
          echo ""
          echo "=============================================="
          echo "Novelpia Global build completed successfully."
          echo ""
          echo "Add this URL to Tsundoku:"
          echo ""
          echo "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/.dist/plugins.min.json"
          echo ""
          echo "=============================================="
