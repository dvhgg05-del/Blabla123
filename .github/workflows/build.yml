name: Build Novelpia plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "plugins/english/novelpiaglobal.ts"
      - "public/static/src/en/novelpiaglobal/**"
      - ".github/workflows/build.yml"
      - "scripts/rewrite-manifest.mjs"

permissions:
  contents: write

concurrency:
  group: novelpia-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # 1. Checkout your repository
      # ----------------------------------------------------------
      - name: Checkout custom repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # 2. Checkout the real LNReader build repository
      # ----------------------------------------------------------
      - name: Checkout LNReader build repository
        uses: actions/checkout@v4
        with:
          repository: LNReader/lnreader-plugins
          ref: master
          path: base
          fetch-depth: 1

      # ----------------------------------------------------------
      # 3. Node.js
      # ----------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: base/package-lock.json

      # ----------------------------------------------------------
      # 4. Install dependencies
      # ----------------------------------------------------------
      - name: Install dependencies
        working-directory: base
        run: npm ci

      # ----------------------------------------------------------
      # 5. Copy your Novelpia source into LNReader's repository
      # ----------------------------------------------------------
      - name: Inject Novelpia plugin
        run: |
          mkdir -p base/plugins/english
          mkdir -p base/public/static/src/en/novelpiaglobal

          cp plugins/english/novelpiaglobal.ts \
            base/plugins/english/novelpiaglobal.ts

          cp public/static/src/en/novelpiaglobal/icon.png \
            base/public/static/src/en/novelpiaglobal/icon.png

      # ----------------------------------------------------------
      # 6. Delete old compiled Novelpia bundle
      # ----------------------------------------------------------
      - name: Remove stale Novelpia build
        run: |
          rm -f base/.js/plugins/english/novelpiaglobal.js
          rm -f base/.dist/plugins/english/novelpiaglobal.js

      # ----------------------------------------------------------
      # 7. Compile plugin
      # ----------------------------------------------------------
      - name: Compile Novelpia
        working-directory: base
        run: npm run build:compile

      # ----------------------------------------------------------
      # 8. Verify compiled JavaScript
      # ----------------------------------------------------------
      - name: Verify compiled plugin
        run: |
          set -e

          test -s \
            base/.js/plugins/english/novelpiaglobal.js

          grep -q \
            "Novelpia Global" \
            base/.js/plugins/english/novelpiaglobal.js

          echo "Novelpia compiled successfully."

      # ----------------------------------------------------------
      # 9. Generate LNReader manifest
      # ----------------------------------------------------------
      - name: Build manifest
        working-directory: base
        run: npm run build:manifest

      # ----------------------------------------------------------
      # 10. Copy only Novelpia into your repository's .dist
      # ----------------------------------------------------------
      - name: Publish Novelpia manifest and bundle
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/rewrite-manifest.mjs

      # ----------------------------------------------------------
      # 11. Verify final manifest
      # ----------------------------------------------------------
      - name: Verify final manifest
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const manifest = JSON.parse(
            fs.readFileSync(
              '.dist/plugins.min.json',
              'utf8'
            )
          );

          if (
            manifest.length !== 1 ||
            manifest[0].id !== 'novelpiaglobal'
          ) {
            throw new Error(
              'Final manifest does not contain Novelpia Global'
            );
          }

          if (
            manifest[0].version !== '2.0.0'
          ) {
            throw new Error(
              `Expected 2.0.0, got ${manifest[0].version}`
            );
          }

          console.log(
            JSON.stringify(
              manifest[0],
              null,
              2
            )
          );
          NODE

      # ----------------------------------------------------------
      # 12. Commit generated files
      # ----------------------------------------------------------
      - name: Commit generated files
        run: |
          git config user.name \
            'github-actions[bot]'

          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git add .dist

          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi

          git commit \
            -m 'build: Novelpia Global 2.0.0'

          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main

      # ----------------------------------------------------------
      # 13. Print repository URL
      # ----------------------------------------------------------
      - name: Print extension URL
        run: |
          echo ""
          echo "=============================================="
          echo "Novelpia Global build completed successfully."
          echo ""
          echo "Extension repository URL:"
          echo ""
          echo "https://raw.githubusercontent.com/${{ github.repository }}/main/.dist/plugins.min.json"
          echo ""
          echo "=============================================="
